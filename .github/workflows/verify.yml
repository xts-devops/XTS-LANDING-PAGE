name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (check · lint · format · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  browser:
    name: browser (e2e · review screenshots)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Skip everything until there is a page to look at.
      - name: Detect pages
        id: pages
        run: echo "found=$([ -f src/pages/index.astro ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.pages.outputs.found == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.pages.outputs.found == 'true'
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.pages.outputs.found == 'true'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.pages.outputs.found == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system deps
        if: steps.pages.outputs.found == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E smoke + axe a11y
        id: e2e
        if: steps.pages.outputs.found == 'true'
        run: npm run test:e2e

      # Screenshots still run when tests fail — reviewers need them most then.
      - name: Review screenshots (375 / 768 / 1440)
        if: steps.pages.outputs.found == 'true' && github.event_name == 'pull_request' && !cancelled()
        run: npm run shots
        env:
          SHOTS_DIR: review-shots
      - name: Upload screenshots
        if: steps.pages.outputs.found == 'true' && github.event_name == 'pull_request' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: review-shots-pr${{ github.event.pull_request.number }}
          path: review-shots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Lighthouse budgets (MOTION §6)
        id: lighthouse
        if: steps.pages.outputs.found == 'true' && github.event_name == 'pull_request' && !cancelled()
        run: npm run build && npm run test:lighthouse
        env:
          # Build as the launch site would be, so the SEO crawlability audit is meaningful.
          PUBLIC_ALLOW_INDEXING: 'true'
      - name: Upload Lighthouse reports
        if: steps.pages.outputs.found == 'true' && github.event_name == 'pull_request' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-pr${{ github.event.pull_request.number }}
          path: .lighthouseci/
          # upload-artifact v4 skips dot-directories unless asked.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
