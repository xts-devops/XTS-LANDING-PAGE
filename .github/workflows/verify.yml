name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      # Enable browser smoke checks as soon as T22 supplies the script/config.
      - name: Browser smoke tests when configured
        shell: bash
        run: |
          if node -e "process.exit(Object.hasOwn(JSON.parse(require('fs').readFileSync('package.json')), 'scripts') && Object.hasOwn(JSON.parse(require('fs').readFileSync('package.json')).scripts, 'test:e2e') ? 0 : 1)"; then
            npx playwright install --with-deps chromium
            npm run test:e2e
          fi
